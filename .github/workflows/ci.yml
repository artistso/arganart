name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce ARCHITECTURE.md rules
        run: python3 tools/check-architecture.py

  build:
    name: assembleDebug + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Install the platform explicitly rather than relying on AGP's own
      # auto-download, so a missing platform fails here with a clear message
      # instead of surfacing as a confusing build error later.
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Distinguishes a Gradle *configuration* failure (plugins, DSL, catalog)
      # from a *compilation* failure. One cheap step that answers the question
      # the build error alone does not.
      - name: Configure
        run: ./gradlew --no-daemon help --stacktrace

      - name: Assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build-output.log

      # This sandbox cannot download job logs, so the build publishes its own
      # compiler errors as check annotations, which ARE readable via the API.
      # Delete once the build is green; it costs nothing as insurance.
      - name: Surface compiler errors
        if: failure()
        run: |
          echo "::group::compiler errors"
          grep -E "^e: |^w: .*error|^> Task .*FAILED|error:|What went wrong|Caused by" build-output.log \
            | head -60 \
            | while IFS= read -r line; do echo "::error::${line//\%/%25}"; done
          echo "::endgroup::"

      - name: Lint
        run: ./gradlew --no-daemon lint --stacktrace

      - name: Unit tests
        run: ./gradlew --no-daemon test --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
