name: CI

on:
  push:
    branches: ["**"]
    # Tag pushes publish the APK to a Release (see publish-apk). Without this,
    # creating a tag triggers nothing and the release stays empty.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce ARCHITECTURE.md rules
        run: python3 tools/check-architecture.py

  build:
    name: assembleDebug + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Install the platform explicitly rather than relying on AGP's own
      # auto-download, so a missing platform fails here with a clear message
      # instead of surfacing as a confusing build error later.
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Distinguishes a Gradle *configuration* failure (plugins, DSL, catalog)
      # from a *compilation* failure. One cheap step that answers the question
      # the build error alone does not.
      - name: Configure
        run: ./gradlew --no-daemon help --stacktrace

      - name: Assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build-output.log

      # This sandbox cannot download job logs, so the build publishes its own
      # compiler errors as check annotations, which ARE readable via the API.
      # Delete once the build is green; it costs nothing as insurance.
      - name: Surface compiler errors
        if: failure()
        run: |
          echo "::group::compiler errors"
          grep -E "^e: |^w: .*error|^> Task .*FAILED|error:|What went wrong|Caused by" build-output.log \
            | head -60 \
            | while IFS= read -r line; do echo "::error::${line//\%/%25}"; done
          echo "::endgroup::"

      - name: Lint
        run: ./gradlew --no-daemon lint --stacktrace

      - name: Unit tests
        run: ./gradlew --no-daemon test --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn

      # The APK is the deliverable a person can actually install and try.
      # Artifact for every run; Release asset for tag pushes (see publish-apk).
      - name: Verify APK exists
        run: |
          find app/build/outputs/apk -name '*.apk' -type f | tee apk-path.txt
          test -s apk-path.txt || { echo "::error::no APK produced"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: argan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish-apk:
    name: Publish APK to Releases
    # Tag pushes only, so a Release asset URL stays stable and shareable.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: argan-debug-apk
          path: dist

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Automated build for $tag"
          gh release upload "$tag" dist/*.apk --clobber
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(cd dist && ls *.apk | head -1)"
