# Pin the Gradle distribution. The wrapper JAR itself is a binary and must be
# generated once on a machine with Gradle installed:
#
#     gradle wrapper --gradle-version 8.11.1
#
# See README.md § "Gradle wrapper". Until then `./gradlew` does not exist and CI
# cannot run; this is tracked as open item P1-2 in docs/reviews/P00-review.md.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
